spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=confighub-group
spring.kafka.consumer.auto-offset-reset=earliest
# Pattern 27: spring.kafka.retry.topic.backoff.random (becomes .jitter in 4.0)
spring.kafka.retry.topic.backoff.random=true
spring.kafka.retry.topic.backoff.delay=1000
spring.kafka.retry.topic.backoff.max-delay=10000
