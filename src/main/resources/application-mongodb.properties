# Pattern 25: spring.data.mongodb.* (becomes spring.mongodb.* in 4.0)
spring.data.mongodb.uri=mongodb://localhost:27017/confighub
spring.data.mongodb.database=confighub

# Pattern 29: management.health.mongo.enabled (becomes management.health.mongodb.enabled in 4.0)
management.health.mongo.enabled=true
# Pattern 30: management.metrics.mongo.command.enabled (becomes management.metrics.mongodb.command.enabled in 4.0)
management.metrics.mongo.command.enabled=true
management.metrics.mongo.connectionpool.enabled=true
