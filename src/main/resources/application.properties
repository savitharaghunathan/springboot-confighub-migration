# Server
server.port=8080
# Pattern 38: server.forward-headers-strategy (no longer effective in WAR in 4.0)
server.forward-headers-strategy=NATIVE

# H2 (default profile)
spring.datasource.url=jdbc:h2:mem:confighub
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate

# Pattern 28: spring.dao.exceptiontranslation.enabled (becomes spring.persistence.exceptiontranslation.enabled in 4.0)
spring.dao.exceptiontranslation.enabled=true

# Jackson
# Pattern 7: spring.jackson.read.* (becomes spring.jackson.json.read.* in 4.0)
spring.jackson.read.use-big-decimal-for-floats=true
# Pattern 8: spring.jackson.write.* (becomes spring.jackson.json.write.* in 4.0)
spring.jackson.write.indent-output=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Liquibase disabled (conflicts with Flyway, but dependency present for pattern 44)
spring.liquibase.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Security — permit all in development mode
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://issuer.example.com/.well-known/jwks.json
spring.security.oauth2.client.registration.confighub.client-id=confighub-client
spring.security.oauth2.client.registration.confighub.client-secret=secret
spring.security.oauth2.client.registration.confighub.scope=openid,profile
spring.security.oauth2.client.registration.confighub.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.confighub.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.confighub.authorization-uri=https://issuer.example.com/authorize
spring.security.oauth2.client.provider.confighub.token-uri=https://issuer.example.com/token
spring.security.oauth2.client.provider.confighub.jwk-set-uri=https://issuer.example.com/.well-known/jwks.json
spring.security.oauth2.client.provider.confighub.user-info-uri=https://issuer.example.com/userinfo
spring.security.oauth2.client.provider.confighub.user-name-attribute=sub

# Batch
spring.batch.job.enabled=false
